services:
  - type: web
    name: finance-ai-agent
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: GROQ_API_KEY
        sync: false          # set this manually in the Render dashboard
      - key: PYTHON_VERSION
        value: "3.11.0"
